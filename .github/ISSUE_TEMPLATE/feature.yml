name: Feature proposal
description: Propose a user job or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: User job
      description: Who is trying to accomplish what, in which context?
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Current workflow and friction
      description: Include actions, decisions, mode switches, failure/recovery and reference tools.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success rather than prescribing a visual style or implementation package.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Scientific/data risk
      options:
        - Low — view/navigation only
        - Medium — writes derived output or changes representation
        - High — may discard/overwrite data or affect interpretation
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Product/reference examples

name: Bug report
description: Report a reproducible MSCanvas problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: impact
    attributes:
      label: User-visible impact
      description: What could you not accomplish, and was data/output at risk?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Add...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: MSCanvas version/commit, Windows version, ProteoWizard path/version, input format. Redact sensitive paths/names.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Do not upload proprietary raw data or patient/sample identifiers.

name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.97.1 fmt --all --check
      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +1.97.1 test --workspace --all-targets

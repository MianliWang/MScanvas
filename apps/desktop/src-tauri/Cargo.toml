[package]
name = "mscanvas-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mscanvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Rendered end-to-end testing against the real Tauri WebView.
#
# Off by default and never enabled for a release build. What it turns on is one
# appended initialization script that can answer this application's own commands
# from a table the page can write -- exactly the capability a shipped binary
# must not carry, because anything running in the document could use it to make
# the interface believe whatever it liked. The WebDriver session itself is
# external (`tauri-driver`), so nothing else about the binary changes.
e2e = []


[build-dependencies]
tauri-build.workspace = true

[dependencies]
mscanvas-core = { path = "../../../crates/core" }
# The semantic figure contract and its export renderer, both repository-owned.
# M4.0 built them and proved them in private; this is the milestone that wires
# them to a user-reachable action. No third-party dependency is added by it.
mscanvas-plot-spec = { path = "../../../crates/plot-spec" }
mscanvas-proteowizard = { path = "../../../crates/proteowizard" }
# The PNG encoder, used for one thing the rasterizer's own writer cannot do:
# record the requested physical resolution in the `pHYs` chunk. Hand-rolling a
# chunk and its CRC beside a reviewed encoder already in this tree would be
# writing a second PNG implementation to add four bytes of metadata.
png = "=0.18.1"
# Rasterizes the SVG this application already produces. Deliberately not a
# second scientific renderer: PNG is the same `FigureSpec`, through the same
# deterministic SVG, put on a pixel grid. Default features are off because the
# figure embeds no bitmaps and is never gzipped -- `text` and `system-fonts` are
# what a figure with axis labels needs and all it needs.
resvg = { version = "=0.48.1", default-features = false, features = [
  "text",
  "system-fonts",
] }
serde.workspace = true
# The UI preference record's only serialization. Promoted from the test-only
# declaration below to an ordinary dependency for M7.5: the store reads and
# writes one small JSON document, and the alternatives were hand-rolling a
# parser beside a reviewed one already in the locked graph, or adding a store
# library to avoid a one-line manifest change. The resolved version is
# unchanged.
serde_json.workspace = true
tauri.workspace = true
# Copy plot writes an image to the clipboard from Rust. The official plugin's
# Rust API is used directly; its generic commands stay denied to the webview,
# which never receives the pixels and has no clipboard capability of its own.
tauri-plugin-clipboard-manager = "=2.3.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  # `SetFileInformationByHandle` with `FileRenameInfo`, and the
  # `FILE_RENAME_INFO` layout it takes. The preference store publishes its
  # record by replacing the published name from the handle the bytes went into,
  # which is the one storage API this feature is enabled for.
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# The same crate the library depends on, with the test-support constructor
# turned on. A dev-dependency because only the test build may have it: a
# conversion this service runs for a user is gated on evidence discovery
# bound to a real executable, and a test that could forge that evidence in a
# shipped build would be a way to forge it anywhere.
mscanvas-proteowizard = { path = "../../../crates/proteowizard", features = [
  "test-support",
] }

[package]
name = "mscanvas-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mscanvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Rendered end-to-end testing against the real Tauri WebView.
#
# Off by default and never enabled for a release build. What it turns on is one
# appended initialization script that can answer this application's own commands
# from a table the page can write -- exactly the capability a shipped binary
# must not carry, because anything running in the document could use it to make
# the interface believe whatever it liked. The WebDriver session itself is
# external (`tauri-driver`), so nothing else about the binary changes.
e2e = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mscanvas-core = { path = "../../../crates/core" }
# The semantic figure contract and its export renderer, both repository-owned.
# M4.0 built them and proved them in private; this is the milestone that wires
# them to a user-reachable action. No third-party dependency is added by it.
mscanvas-plot-spec = { path = "../../../crates/plot-spec" }
mscanvas-proteowizard = { path = "../../../crates/proteowizard" }
serde.workspace = true
tauri.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# The same crate the library depends on, with the test-support constructor
# turned on. A dev-dependency because only the test build may have it: a
# conversion this service runs for a user is gated on evidence discovery
# bound to a real executable, and a test that could forge that evidence in a
# shipped build would be a way to forge it anywhere.
mscanvas-proteowizard = { path = "../../../crates/proteowizard", features = [
  "test-support",
] }
serde_json.workspace = true

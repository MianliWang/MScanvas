<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200.000" height="640.000" viewBox="0 0 1200.000 640.000" role="img">
<title>Chromatogram</title>
<desc>Total ion current and base peak intensity over the range 10 to 13, from 5 scans. Per-scan values projected from the loaded spectrum table, not a stored chromatogram record. Retention time and intensity units unreported. An ordered trace over the separation axis. Series: &quot;TIC&quot; is measured data, &quot;BPC&quot; is a second measured series. The value axis shows 0 to 120, which is a window into a source that reaches 0 to 9000000. This figure draws only that window. The source file reports no unit for the Retention time or the Intensity axis, so none is shown.</desc>
<rect x="0" y="0" width="1200.000" height="640.000" fill="#ffffff"/>
<text x="64.000" y="24.000" fill="#111111" font-family="sans-serif" font-size="16.000" font-weight="600" xml:space="preserve" textLength="192.000" lengthAdjust="spacingAndGlyphs">Chromatogram</text>
<line x1="64.000" y1="550.000" x2="1180.000" y2="550.000" stroke="#333333" stroke-width="1"/>
<line x1="64.000" y1="48.000" x2="64.000" y2="550.000" stroke="#333333" stroke-width="1"/>
<path d="M64.000 173.500L436.000 131.667L808.000 89.833L1180.000 48.000" fill="none" stroke="#1f4e9c" stroke-width="1"/>
<path d="M64.000 466.333L436.000 424.500L808.000 382.667L1180.000 340.833" fill="none" stroke="#9a4a00" stroke-width="1" stroke-dasharray="6 3"/>
<line x1="1121.000" y1="55.333" x2="1139.000" y2="55.333" stroke="#1f4e9c" stroke-width="1"/>
<text x="1176.000" y="59.000" fill="#111111" font-family="sans-serif" font-size="11.000" text-anchor="end" textLength="33.000" lengthAdjust="spacingAndGlyphs">TIC</text>
<line x1="1121.000" y1="69.333" x2="1139.000" y2="69.333" stroke="#9a4a00" stroke-width="1" stroke-dasharray="6 3"/>
<text x="1176.000" y="73.000" fill="#111111" font-family="sans-serif" font-size="11.000" text-anchor="end" textLength="33.000" lengthAdjust="spacingAndGlyphs">BPC</text>
<text x="64.000" y="564.000" fill="#111111" font-family="sans-serif" font-size="11" textLength="55.000" lengthAdjust="spacingAndGlyphs">10.00</text>
<text x="1180.000" y="564.000" fill="#111111" font-family="sans-serif" font-size="11" text-anchor="end" textLength="55.000" lengthAdjust="spacingAndGlyphs">13.00</text>
<text x="622.000" y="580.000" fill="#111111" font-family="sans-serif" font-size="12.000" text-anchor="middle" xml:space="preserve" textLength="168.000" lengthAdjust="spacingAndGlyphs">Retention time</text>
<text x="14.000" y="299.000" fill="#111111" font-family="sans-serif" font-size="12.000" text-anchor="middle" transform="rotate(-90 14.000 299.000)" xml:space="preserve" textLength="108.000" lengthAdjust="spacingAndGlyphs">Intensity</text>
<text x="68.000" y="58.000" fill="#111111" font-family="sans-serif" font-size="11" textLength="33.000" lengthAdjust="spacingAndGlyphs">120</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200.0000" height="640.0000" viewBox="0 0 1200.0000 640.0000" role="img">
<title>Selected spectrum in chromatographic context</title>
<desc>Two panels. The upper panel is the chromatogram: Total ion current and base peak intensity over the full run, from 5 scans -- per-scan values projected from the loaded spectrum table, not a stored chromatogram record. Its one marker identifies spectrum index 2, and that scan is the lower panel: the complete selected spectrum, 4 points, never narrowed to the chromatogram range. Retention time, m/z and intensity units unreported. Panel 1 of 2, counting from the top. An ordered trace over the separation axis. Series: &quot;TIC&quot; is measured data, &quot;BPC&quot; is a second measured series. The source file reports no unit for the Retention time or the Intensity axis, so none is shown. One marker line is drawn on the Retention time axis: &quot;Selected scan&quot; at 11.00. Panel 2 of 2, counting from the top. The source file does not report whether these are profile samples or centroided peaks, so each mark is one measured point rather than a peak. Series: &quot;measurement&quot; is measured data. The source file reports no unit for the m/z or the Intensity axis, so none is shown.</desc>

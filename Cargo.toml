[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/plot-spec",
  "crates/proteowizard",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["MSCanvas contributors"]
repository = "https://github.com/MianliWang/MScanvas"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/plot-spec",
  "crates/proteowizard",
  "crates/stats",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["MSCanvas contributors"]
repository = "https://github.com/MianliWang/MScanvas"

[workspace.dependencies]
# ADR 0056: decode one selected mzML spectrum's arrays. Both were already locked.
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# ADR 0069 (owner decision D7, 2026-10-30): the statistics crate's eigen
# decomposition and Student's t distribution.
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
quick-xml = { version = "=0.41.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR 0069, with nalgebra above.
statrs = { version = "=0.19.1", default-features = false }
tauri = "2"
tauri-build = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
